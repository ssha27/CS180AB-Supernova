services:
  supernova:
    build:
      context: .
      args:
        SUPERNOVA_TORCH_INDEX_URL: ${SUPERNOVA_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        SUPERNOVA_TORCH_VERSION: ${SUPERNOVA_TORCH_VERSION:-2.3.1}
        SUPERNOVA_TORCHVISION_VERSION: ${SUPERNOVA_TORCHVISION_VERSION:-0.18.1}
    ports:
      - "8000:8000"
    shm_size: '2g'
    environment:
      - SUPERNOVA_STATIC_DIR=/app/frontend/dist
      - SUPERNOVA_OUTPUT_DIR=/data/supernova
    volumes:
      - supernova-data:/data/supernova
    deploy:
      resources:
        limits:
          memory: 16g

volumes:
  supernova-data:
