services:
  supernova:
    build:
      context: .
      args:
        SUPERNOVA_TORCH_INDEX_URL: ${SUPERNOVA_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu121}
        SUPERNOVA_TORCH_VERSION: ${SUPERNOVA_TORCH_VERSION:-2.3.1}
        SUPERNOVA_TORCHVISION_VERSION: ${SUPERNOVA_TORCHVISION_VERSION:-0.18.1}
    container_name: supernova
    init: true
    restart: unless-stopped
    ports:
      - "${SUPERNOVA_HOST_PORT:-80}:8000"
    gpus:
      - driver: nvidia
        count: all
        capabilities: [gpu]
    shm_size: '2g'
    environment:
      SUPERNOVA_STATIC_DIR: /app/frontend/dist
      SUPERNOVA_OUTPUT_DIR: /data/supernova
    volumes:
      - ${SUPERNOVA_HOST_DATA_DIR:-/srv/supernova-data}:/data/supernova